<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKILLX - Track Applications & Proposals</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Google Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Common & Page Stylesheet -->
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="applications.css" />
</head>
<body>

  <!-- ==========================================
       1. Top Navigation Bar
       ========================================== -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="logo-area">
        <a href="index.html" class="logo">SKILLX</a>
      </div>

      <ul class="nav-links">
        <li><a href="find-work.html">Find Work</a></li>
        <li><a href="find-work.html">Find Talent</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="applications.html" class="active">Applications</a></li>
      </ul>

      <div class="nav-actions">
        <a href="find-work.html" class="btn btn-outline" style="border-color: #cbd5e1; color: var(--text-main);">Browse Gigs</a>
        <a href="dashboard.html" class="btn btn-royal">Dashboard</a>
      </div>
    </div>
  </header>

  <!-- ==========================================
       Main Applications Container
       ========================================== -->
  <main class="container applications-page">
    
    <!-- Header Row -->
    <div class="applications-header-row">
      <div>
        <h1>My Applications & Proposals</h1>
        <p>Monitor your submitted proposals, track client review statuses, and export your application data.</p>
      </div>

      <div class="header-action-btns">
        <button type="button" class="btn btn-outline" onclick="exportAllApplicationsJSON()" title="Export all applications to a local JSON file">
          <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
          <span>Export All (JSON)</span>
        </button>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('importJsonInput').click()" title="Import applications from an existing JSON file">
          <span class="material-symbols-outlined" style="font-size: 18px;">upload</span>
          <span>Import JSON</span>
        </button>
        <input type="file" id="importJsonInput" accept=".json" style="display: none;" onchange="handleImportJSON(event)" />
      </div>
    </div>

    <!-- Filter and Search Bar -->
    <div class="applications-filter-bar">
      <div class="filter-pills-row">
        <button type="button" class="filter-pill-btn active" onclick="filterApplicationsByStatus('All', this)">All (<span id="countAll">0</span>)</button>
        <button type="button" class="filter-pill-btn" onclick="filterApplicationsByStatus('Under Review', this)">Under Review (<span id="countReview">0</span>)</button>
        <button type="button" class="filter-pill-btn" onclick="filterApplicationsByStatus('Shortlisted', this)">Shortlisted (<span id="countShortlisted">0</span>)</button>
        <button type="button" class="filter-pill-btn" onclick="filterApplicationsByStatus('Accepted', this)">Accepted (<span id="countAccepted">0</span>)</button>
      </div>

      <div class="search-app-input">
        <span class="material-symbols-outlined" style="font-size: 16px; color: var(--text-light);">search</span>
        <input type="text" placeholder="Filter by title or client..." onkeyup="handleAppSearch(this.value)" />
      </div>
    </div>

    <!-- Applications List Container -->
    <div class="applications-list" id="applicationsContainer">
      <!-- Populated dynamically via JavaScript -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer-simple">
    <div class="container footer-container">
      <p>© 2026 SKILLX. Built for Campus Freelancers.</p>
      <div class="footer-nav">
        <a href="#about" onclick="showToast('SKILLX Campus Marketplace v2.0')">About</a>
        <a href="#contact" onclick="showToast('Contact support: help@skillx.campus')">Contact</a>
        <a href="#terms" onclick="showToast('Terms of Service and Escrow Guarantee')">Terms</a>
      </div>
    </div>
  </footer>

  <!-- App Core JS -->
  <script src="app.js"></script>
  <script>
    let currentFilter = 'All';
    let searchQuery = '';

    document.addEventListener('DOMContentLoaded', () => {
      // Check if redirected right after submission
      const params = new URLSearchParams(window.location.search);
      if (params.get('submitted') === 'true') {
        showToast('🎉 Proposal submitted! Application stored in local memory & JSON downloaded.', 'success');
      }

      renderApplications();
    });

    function renderApplications() {
      const container = document.getElementById('applicationsContainer');
      const apps = getApplications();

      // Update pill counters
      document.getElementById('countAll').innerText = apps.length;
      document.getElementById('countReview').innerText = apps.filter(a => a.status === 'Under Review').length;
      document.getElementById('countShortlisted').innerText = apps.filter(a => a.status === 'Shortlisted').length;
      document.getElementById('countAccepted').innerText = apps.filter(a => a.status === 'Accepted').length;

      // Filter
      const filtered = apps.filter(app => {
        const matchesStatus = (currentFilter === 'All') || (app.status === currentFilter);
        const matchesSearch = !searchQuery || 
          app.projectTitle.toLowerCase().includes(searchQuery) || 
          app.clientName.toLowerCase().includes(searchQuery);
        return matchesStatus && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card">
            <span class="material-symbols-outlined">inbox</span>
            <h3>No applications found</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">You haven't submitted any proposals matching this criteria.</p>
            <a href="find-work.html" class="btn btn-royal" style="margin-top: 18px;">Find Projects to Apply</a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(app => {
        const dateFormatted = new Date(app.submittedAt).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric'
        });

        const statusClass = app.status === 'Accepted' ? 'accepted' : app.status === 'Shortlisted' ? 'shortlisted' : 'review';
        const safeJson = encodeURIComponent(JSON.stringify(app));

        return `
          <article class="application-card">
            <div class="app-card-top-line">
              <div>
                <h3>${escapeHtml(app.projectTitle)}</h3>
                <div class="app-client-sub">Client: <strong>${escapeHtml(app.clientName)}</strong> • Submitted: ${dateFormatted}</div>
              </div>
              <span class="app-status-badge ${statusClass}">
                <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>
                <span>${escapeHtml(app.status)}</span>
              </span>
            </div>

            <div class="app-cover-preview">
              <strong style="color: var(--text-main); display: block; margin-bottom: 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">Proposal Excerpt:</strong>
              "${escapeHtml(app.coverLetter)}"
            </div>

            <div class="app-meta-details-row">
              <div class="app-meta-items">
                <span>Budget: <strong style="color: var(--brand-green);">${escapeHtml(app.budget)}</strong></span>
                <span>Est. Delivery: <strong>${escapeHtml(app.estimatedDelivery)}</strong></span>
                <span>Portfolio: <a href="${escapeHtml(app.portfolioLink)}" target="_blank" style="color: var(--primary-blue); text-decoration: underline;">${escapeHtml(app.portfolioLink)}</a></span>
                ${app.fileName && app.fileName !== 'No file attached' ? `<span>Attachment: 📎 ${escapeHtml(app.fileName)}</span>` : ''}
              </div>

              <div class="app-action-buttons">
                <button type="button" class="btn-json-dl" onclick="downloadSingleAppJSON('${app.id}')">
                  <span class="material-symbols-outlined" style="font-size: 16px;">file_download</span>
                  <span>Save JSON</span>
                </button>
                <a href="project-details.html?id=${encodeURIComponent(app.projectId)}" class="btn-json-dl" style="color: var(--text-main);">
                  <span>View Project</span>
                  <span class="material-symbols-outlined" style="font-size: 14px;">arrow_forward</span>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterApplicationsByStatus(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.filter-pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderApplications();
    }

    function handleAppSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderApplications();
    }

    // Download Single Application JSON file
    function downloadSingleAppJSON(id) {
      const apps = getApplications();
      const app = apps.find(a => a.id === id);
      if (app) {
        downloadJSON(app, `application_${app.id}.json`);
        showToast(`Downloaded application_${app.id}.json`, 'success');
      }
    }

    // Export All Applications as JSON file
    function exportAllApplicationsJSON() {
      const apps = getApplications();
      downloadJSON(apps, 'applications.json');
      showToast('Downloaded full applications.json file!', 'success');
    }

    // Import external JSON file into localStorage
    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const current = getApplications();
          if (Array.isArray(parsed)) {
            const merged = [...parsed, ...current];
            localStorage.setItem(STORAGE_KEYS.APPLICATIONS, JSON.stringify(merged));
          } else if (parsed && parsed.id) {
            current.unshift(parsed);
            localStorage.setItem(STORAGE_KEYS.APPLICATIONS, JSON.stringify(current));
          }
          showToast('Applications imported successfully!', 'success');
          renderApplications();
        } catch (err) {
          showToast('Failed to parse JSON file: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
