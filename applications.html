<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKILLX - Track Applications & Proposals</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Google Material Symbols Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Common & Page Stylesheet -->
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="applications.css" />
</head>
<body>

  <!-- ==========================================
       1. Top Navigation Bar
       ========================================== -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="logo-area">
        <a href="index.html" class="logo">SKILLX</a>
      </div>

      <ul class="nav-links">
        <li><a href="find-work.html">Find Work</a></li>
        <li><a href="find-work.html">Find Talent</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="applications.html" class="active">Applications</a></li>
      </ul>

      <div class="nav-actions">
        <a href="find-work.html" class="btn btn-outline" style="border-color: #cbd5e1; color: var(--text-main);">Browse Gigs</a>
        <a href="dashboard.html" class="btn btn-royal">Dashboard</a>
      </div>
    </div>
  </header>

  <!-- ==========================================
       Main Applications Container
       ========================================== -->
  <main class="container applications-page">
    
    <!-- Header Row -->
    <div class="applications-header-row">
      <div>
        <h1>My Applications & Proposals</h1>
        <p>Monitor your submitted proposals, track client review statuses, and export your application data.</p>
      </div>

      <div class="header-action-btns">
        <button type="button" class="btn btn-outline" id="exportAllBtn" title="Export all applications to a local JSON file">
          <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
          <span>Export All (JSON)</span>
        </button>
        <button type="button" class="btn btn-ghost" id="importJsonBtn" title="Import applications from an existing JSON file">
          <span class="material-symbols-outlined" style="font-size: 18px;">upload</span>
          <span>Import JSON</span>
        </button>
        <input type="file" id="importJsonInput" accept=".json" style="display: none;" />
      </div>
    </div>

    <!-- Filter and Search Bar -->
    <div class="applications-filter-bar">
      <div class="filter-pills-row">
        <button type="button" class="filter-pill-btn active" data-status="All">All (<span id="countAll">0</span>)</button>
        <button type="button" class="filter-pill-btn" data-status="Under Review">Under Review (<span id="countReview">0</span>)</button>
        <button type="button" class="filter-pill-btn" data-status="Shortlisted">Shortlisted (<span id="countShortlisted">0</span>)</button>
        <button type="button" class="filter-pill-btn" data-status="Accepted">Accepted (<span id="countAccepted">0</span>)</button>
      </div>

      <div class="search-app-input">
        <span class="material-symbols-outlined" style="font-size: 16px; color: var(--text-light);">search</span>
        <input type="text" id="appSearchInput" placeholder="Filter by title or client..." />
      </div>
    </div>

    <!-- Applications List Container -->
    <div class="applications-list" id="applicationsContainer">
      <!-- Populated dynamically via JavaScript -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer-simple">
    <div class="container footer-container">
      <p>© 2026 SKILLX. Built for Campus Freelancers.</p>
      <div class="footer-nav">
        <a href="#" data-toast="SKILLX Campus Marketplace v2.0">About</a>
        <a href="#" data-toast="Contact support: help@skillx.campus">Contact</a>
        <a href="#" data-toast="Terms of Service and Escrow Guarantee">Terms</a>
      </div>
    </div>
  </footer>

  <!-- App Core & Page JS -->
  <script src="app.js"></script>
  <script src="applications.js"></script>
</body>
</html>
